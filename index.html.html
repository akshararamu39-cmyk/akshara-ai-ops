<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshara AI Operations Platform — Interactive Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_BRANCHES = [
      { id: "br-01", code: "AKSH-B01", name: "Branch 01 (Placeholder)", location: "Location Pending", tech: "Tech-01 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-02", code: "AKSH-B02", name: "Branch 02 (Placeholder)", location: "Location Pending", tech: "Tech-02 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-03", code: "AKSH-B03", name: "Branch 03 (Placeholder)", location: "Location Pending", tech: "Tech-03 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-04", code: "AKSH-B04", name: "Branch 04 (Placeholder)", location: "Location Pending", tech: "Tech-04 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-05", code: "AKSH-B05", name: "Branch 05 (Placeholder)", location: "Location Pending", tech: "Tech-05 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-06", code: "AKSH-B06", name: "Branch 06 (Placeholder)", location: "Location Pending", tech: "Tech-06 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-07", code: "AKSH-B07", name: "Branch 07 (Placeholder)", location: "Location Pending", tech: "Tech-07 (Placeholder)", active: true, statusNote: "Placeholder Name" },
      { id: "br-08", code: "AKSH-POCH", name: "Pocharam Branch", location: "Pocharam, Telangana", tech: "Branch IT Lead (Pocharam)", active: true, statusNote: "Configured Branch" },
    ];

    const ALL_STATUSES = [
      "NEW",
      "ACKNOWLEDGED",
      "ASSIGNED",
      "IN_PROGRESS",
      "WAITING_FOR_USER",
      "ESCALATED",
      "RESOLVED",
      "CLOSED",
    ];

    const INITIAL_TICKETS = [
      {
        id: "tkt-101",
        ticketNumber: "AKSH-20261124-0101",
        branchId: "br-08",
        requester: "staff.pocharam@akshara.edu.in",
        assignedTech: "Branch IT Lead (Pocharam)",
        title: "Interactive panel display not turning on in Block A",
        description: "Classroom interactive panel shows power LED but no display output during morning period.",
        attachmentName: "panel-led-photo.jpg",
        category: "CLASSROOM_TECHNOLOGY",
        priority: "MEDIUM",
        status: "ASSIGNED",
        resolutionConfirmed: false,
        createdAt: "2026-11-24T09:15:00Z",
        aiSuggestion: {
          category: "CLASSROOM_TECHNOLOGY",
          priority: "MEDIUM",
          suggestedTeam: "AV_CLASSROOM_TECH",
          summary: "Classroom interactive panel shows power LED but no display output during morning period.",
          confidence: 0.92,
          possibleDuplicate: false,
          requiresHumanReview: false,
          isSuggestionOnly: true,
        },
        events: [
          { timestamp: "2026-11-24T09:15:00Z", actor: "staff.pocharam", type: "CREATED", note: "Ticket submitted by branch staff." },
          { timestamp: "2026-11-24T09:18:00Z", actor: "central.it", type: "ASSIGNED", note: "Assigned to Branch IT Lead (Pocharam)." },
        ],
      },
      {
        id: "tkt-102",
        ticketNumber: "AKSH-20261124-0102",
        branchId: "br-01",
        requester: "admin.b01@akshara.edu.in",
        assignedTech: "Tech-01 (Placeholder)",
        title: "Main entrance CCTV NVR feed offline",
        description: "Channel 4 camera feed near gate shows no video signal since morning.",
        attachmentName: "",
        category: "CCTV",
        priority: "HIGH",
        status: "ESCALATED",
        resolutionConfirmed: false,
        createdAt: "2026-11-24T08:05:00Z",
        aiSuggestion: {
          category: "CCTV",
          priority: "HIGH",
          suggestedTeam: "SECURITY_CCTV_REVIEW",
          summary: "Channel 4 camera feed near gate shows no video signal since morning.",
          confidence: 0.89,
          possibleDuplicate: false,
          requiresHumanReview: true,
          isSuggestionOnly: true,
        },
        events: [
          { timestamp: "2026-11-24T08:05:00Z", actor: "admin.b01", type: "CREATED", note: "Ticket logged; human review enforced for CCTV category." },
          { timestamp: "2026-11-24T10:30:00Z", actor: "SLA_ENGINE", type: "ESCALATED", note: "Escalated per configurable SLA threshold." },
        ],
      },
    ];

    function classifyTicketPreview(title, description, existingTickets, branchId) {
      const text = `${title} ${description}`.toLowerCase();
      let category = "HARDWARE";
      let priority = "MEDIUM";
      let suggestedTeam = "IT_SUPPORT";
      let confidence = 0.68;

      if (text.includes("cctv") || text.includes("camera") || text.includes("nvr")) {
        category = "CCTV";
        priority = "HIGH";
        suggestedTeam = "SECURITY_CCTV_REVIEW";
        confidence = 0.89;
      } else if (text.includes("password") || text.includes("account") || text.includes("login") || text.includes("sso")) {
        category = "ACCOUNT_ACCESS";
        priority = "HIGH";
        suggestedTeam = "IT_SUPPORT";
        confidence = 0.86;
      } else if (text.includes("projector") || text.includes("panel") || text.includes("smartboard") || text.includes("classroom")) {
        category = "CLASSROOM_TECHNOLOGY";
        priority = "MEDIUM";
        suggestedTeam = "AV_CLASSROOM_TECH";
        confidence = 0.91;
      } else if (text.includes("wifi") || text.includes("network") || text.includes("internet") || text.includes("router")) {
        category = "NETWORK";
        priority = "HIGH";
        suggestedTeam = "NETWORK_OPS";
        confidence = 0.88;
      } else if (text.includes("printer") || text.includes("toner")) {
        category = "PRINTER";
        priority = "LOW";
        suggestedTeam = "IT_SUPPORT";
        confidence = 0.85;
      }

      const possibleDuplicate = Boolean(
        title.trim() &&
        existingTickets.some(
          (t) =>
            t.branchId === branchId &&
            t.status !== "CLOSED" &&
            t.title.toLowerCase().includes(title.trim().toLowerCase().slice(0, 14))
        )
      );

      const requiresHumanReview =
        confidence < 0.75 || category === "CCTV" || category === "ACCOUNT_ACCESS" || possibleDuplicate;

      return {
        category,
        priority,
        suggestedTeam,
        summary: description.trim().slice(0, 140) || title.trim() || "Awaiting ticket details.",
        confidence,
        possibleDuplicate,
        requiresHumanReview,
        isSuggestionOnly: true,
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState("HELPDESK");
      const [roleScope, setRoleScope] = useState("CENTRAL_IT");
      const [branchFilter, setBranchFilter] = useState("ALL");
      const [statusFilter, setStatusFilter] = useState("ALL");
      const [categoryFilter, setCategoryFilter] = useState("ALL");

      const [branches, setBranches] = useState(() => {
        try {
          const saved = localStorage.getItem("akshara_preview_branches_v1");
          return saved ? JSON.parse(saved) : INITIAL_BRANCHES;
        } catch {
          return INITIAL_BRANCHES;
        }
      });

      const [tickets, setTickets] = useState(() => {
        try {
          const saved = localStorage.getItem("akshara_preview_tickets_v1");
          return saved ? JSON.parse(saved) : INITIAL_TICKETS;
        } catch {
          return INITIAL_TICKETS;
        }
      });

      const [slaConfig, setSlaConfig] = useState({
        CRITICAL: { escalateHrs: 2, resolveHrs: 4 },
        HIGH: { escalateHrs: 5, resolveHrs: 8 },
        MEDIUM: { escalateHrs: 18, resolveHrs: 24 },
        LOW: { escalateHrs: 48, resolveHrs: 72 },
      });

      const [auditLogs, setAuditLogs] = useState([
        { timestamp: "2026-11-24T08:00:00Z", actor: "SYSTEM", branch: "CENTRAL", action: "PLATFORM_INIT", detail: "Initialized 8-branch roster (Pocharam + 7 placeholders) & RLS guardrails." },
      ]);

      const [newBranchId, setNewBranchId] = useState("br-08");
      const [title, setTitle] = useState("");
      const [description, setDescription] = useState("");
      const [attachmentName, setAttachmentName] = useState("");
      const [commentDrafts, setCommentDrafts] = useState({});
      const [confirmMap, setConfirmMap] = useState({});
      const [banner, setBanner] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem("akshara_preview_branches_v1", JSON.stringify(branches));
          localStorage.setItem("akshara_preview_tickets_v1", JSON.stringify(tickets));
        } catch {}
      }, [branches, tickets]);

      const visibleBranches = useMemo(() => {
        if (roleScope === "CENTRAL_IT") return branches;
        if (roleScope === "BRANCH_POCHARAM") return branches.filter((b) => b.id === "br-08");
        return branches.filter((b) => b.id === "br-01");
      }, [branches, roleScope]);

      const visibleTickets = useMemo(() => {
        return tickets.filter((t) => {
          if (roleScope === "BRANCH_POCHARAM" && t.branchId !== "br-08") return false;
          if (roleScope === "BRANCH_01" && t.branchId !== "br-01") return false;
          if (roleScope === "CENTRAL_IT" && branchFilter !== "ALL" && t.branchId !== branchFilter) return false;
          if (statusFilter !== "ALL" && t.status !== statusFilter) return false;
          if (categoryFilter !== "ALL" && t.category !== categoryFilter) return false;
          return true;
        });
      }, [tickets, roleScope, branchFilter, statusFilter, categoryFilter]);

      const aiPreview = useMemo(
        () => classifyTicketPreview(title, description, tickets, newBranchId),
        [title, description, tickets, newBranchId]
      );

      function logAudit(action, branch, detail) {
        setAuditLogs((prev) => [
          { timestamp: new Date().toISOString(), actor: roleScope, branch, action, detail },
          ...prev,
        ]);
      }

      function handleCreateTicket(e) {
        e.preventDefault();
        if (roleScope === "DISABLED_USER") {
          setBanner({ type: "error", text: "Access denied: Disabled user accounts cannot perform actions." });
          return;
        }
        if (!title.trim() || !description.trim()) {
          setBanner({ type: "error", text: "Please enter both an issue title and description." });
          return;
        }
        if (roleScope === "BRANCH_POCHARAM" && newBranchId !== "br-08") {
          setBanner({ type: "error", text: "Branch isolation blocked: Pocharam staff cannot raise tickets for another branch." });
          return;
        }
        if (roleScope === "BRANCH_01" && newBranchId !== "br-01") {
          setBanner({ type: "error", text: "Branch isolation blocked: Branch 01 staff cannot raise tickets for another branch." });
          return;
        }

        const suggestion = classifyTicketPreview(title, description, tickets, newBranchId);
        const branchObj = branches.find((b) => b.id === newBranchId);
        const now = new Date().toISOString();
        const ticketNumber = `AKSH-20261124-${String(tickets.length + 101).padStart(4, "0")}`;

        const created = {
          id: `tkt-${Date.now()}`,
          ticketNumber,
          branchId: newBranchId,
          requester: `${roleScope.toLowerCase()}@akshara.edu.in`,
          assignedTech: branchObj ? branchObj.tech : "Unassigned",
          title: title.trim(),
          description: description.trim(),
          attachmentName,
          category: suggestion.category,
          priority: suggestion.priority,
          status: "NEW",
          resolutionConfirmed: false,
          createdAt: now,
          aiSuggestion: suggestion,
          events: [
            {
              timestamp: now,
              actor: roleScope,
              type: "CREATED",
              note: `Created with AI suggestion (${suggestion.category} / ${suggestion.priority}, confidence ${Math.round(suggestion.confidence * 100)}%).`,
            },
          ],
        };

        setTickets((prev) => [created, ...prev]);
        logAudit("TICKET_CREATED", newBranchId, `${ticketNumber} created (${suggestion.category})`);
        setTitle("");
        setDescription("");
        setAttachmentName("");
        setBanner({ type: "ok", text: `Ticket ${ticketNumber} created successfully.` });
      }

      function handleStatusChange(ticketId, nextStatus) {
        if (roleScope === "DISABLED_USER") {
          setBanner({ type: "error", text: "Access denied: Disabled user accounts cannot update tickets." });
          return;
        }
        const confirmed = Boolean(confirmMap[ticketId]);
        if (nextStatus === "CLOSED" && !confirmed) {
          setBanner({
            type: "error",
            text: "Guardrail enforced: User resolution confirmation checkbox must be ticked before closing a ticket.",
          });
          return;
        }

        const now = new Date().toISOString();
        setTickets((prev) =>
          prev.map((t) => {
            if (t.id !== ticketId) return t;
            return {
              ...t,
              status: nextStatus,
              resolutionConfirmed: confirmed || t.resolutionConfirmed,
              events: [
                ...t.events,
                {
                  timestamp: now,
                  actor: roleScope,
                  type: `STATUS_${nextStatus}`,
                  note: `Moved to ${nextStatus}${confirmed ? " (resolution confirmed)" : ""}.`,
                },
              ],
            };
          })
        );
        logAudit("TICKET_STATUS_UPDATED", ticketId, `Ticket ${ticketId} -> ${nextStatus}`);
        setBanner({ type: "ok", text: `Ticket status updated to ${nextStatus}.` });
      }

      function handleAddComment(ticketId) {
        const text = (commentDrafts[ticketId] || "").trim();
        if (!text) return;
        const now = new Date().toISOString();
        setTickets((prev) =>
          prev.map((t) =>
            t.id === ticketId
              ? {
                  ...t,
                  events: [...t.events, { timestamp: now, actor: roleScope, type: "COMMENT", note: text }],
                }
              : t
          )
        );
        setCommentDrafts((prev) => ({ ...prev, [ticketId]: "" }));
        logAudit("TICKET_COMMENT", ticketId, "Added comment to ticket.");
      }

      function exportCsvReport() {
        const header = ["TicketNumber", "BranchID", "Category", "Priority", "Status", "Title"];
        const rows = visibleTickets.map((t) =>
          [t.ticketNumber, t.branchId, t.category, t.priority, t.status, `"${t.title.replace(/"/g, '""')}"`].join(",")
        );
        const blob = new Blob([[header.join(","), ...rows].join("\n")], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "akshara-helpdesk-report.csv";
        a.click();
        URL.revokeObjectURL(url);
        logAudit("REPORT_EXPORTED", roleScope, `Exported ${visibleTickets.length} scoped tickets to CSV.`);
      }

      function resetDemoData() {
        localStorage.removeItem("akshara_preview_branches_v1");
        localStorage.removeItem("akshara_preview_tickets_v1");
        setBranches(INITIAL_BRANCHES);
        setTickets(INITIAL_TICKETS);
        setBanner({ type: "ok", text: "Demo data reset to initial 8-branch state." });
      }

      const openTicketsCount = visibleTickets.filter((t) => !["RESOLVED", "CLOSED"].includes(t.status)).length;
      const escalatedCount = visibleTickets.filter((t) => t.status === "ESCALATED").length;
      const resolvedCount = visibleTickets.filter((t) => ["RESOLVED", "CLOSED"].includes(t.status)).length;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Header */}
          <header className="border-b border-slate-200 bg-white sticky top-0 z-10">
            <div className="mx-auto max-w-7xl px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div>
                <div className="text-[11px] font-semibold uppercase tracking-wider text-indigo-700">
                  Akshara International School Group • 1 Central Office + 8 Branches
                </div>
                <h1 className="text-lg sm:text-xl font-bold text-slate-900">
                  Akshara AI Operations Platform (Release 1 Preview)
                </h1>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <label className="text-xs font-medium text-slate-600">Test Role &amp; Branch Access:</label>
                <select
                  value={roleScope}
                  onChange={(e) => {
                    const val = e.target.value;
                    setRoleScope(val);
                    if (val === "BRANCH_POCHARAM") setNewBranchId("br-08");
                    if (val === "BRANCH_01") setNewBranchId("br-01");
                    logAudit("ROLE_SWITCH", val, `Switched simulated access scope to ${val}`);
                  }}
                  className="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-800"
                >
                  <option value="CENTRAL_IT">Central IT Admin (All 8 Branches)</option>
                  <option value="BRANCH_POCHARAM">Branch Staff — Pocharam Only</option>
                  <option value="BRANCH_01">Branch Staff — Branch 01 Only</option>
                  <option value="DISABLED_USER">Disabled User (Negative Test)</option>
                </select>
                <button
                  onClick={resetDemoData}
                  className="rounded-md border border-slate-200 bg-slate-100 px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-200"
                >
                  Reset Data
                </button>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="mx-auto max-w-7xl px-4 flex gap-6 border-t border-slate-100 text-xs font-semibold">
              {[
                { id: "HELPDESK", label: "IT Helpdesk & AI Triage" },
                { id: "BRANCHES", label: "8 Branches & SLA Rules" },
                { id: "REPORTS", label: "Dashboard, ERP/CRM & Audit" },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-2.5 border-b-2 transition ${
                    activeTab === tab.id
                      ? "border-indigo-700 text-indigo-700"
                      : "border-transparent text-slate-500 hover:text-slate-800"
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Content */}
          <main className="mx-auto max-w-7xl w-full flex-1 px-4 py-6 space-y-6">
            {banner && (
              <div
                className={`rounded-lg border px-4 py-3 text-xs font-medium flex items-center justify-between ${
                  banner.type === "error"
                    ? "border-rose-200 bg-rose-50 text-rose-900"
                    : "border-emerald-200 bg-emerald-50 text-emerald-900"
                }`}
              >
                <span>{banner.text}</span>
                <button onClick={() => setBanner(null)} className="underline ml-4">Dismiss</button>
              </div>
            )}

            {roleScope === "DISABLED_USER" ? (
              <div className="rounded-lg border border-rose-200 bg-rose-50 p-6 text-center space-y-2">
                <h2 className="text-base font-bold text-rose-900">403 Forbidden — Account Disabled</h2>
                <p className="text-xs text-rose-800">
                  Security requirement verified: deactivated users cannot view branch data, raise tickets, or access reports. Switch the role selector above to resume testing.
                </p>
              </div>
            ) : (
              <>
                {/* Summary KPI Cards */}
                <section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                  <div className="rounded-lg border border-slate-200 bg-white p-4">
                    <div className="text-xs text-slate-500">Accessible Branches</div>
                    <div className="mt-1 text-2xl font-bold">{visibleBranches.length} / 8</div>
                    <div className="mt-1 text-[11px] text-slate-500">Branch-level isolation active</div>
                  </div>
                  <div className="rounded-lg border border-slate-200 bg-white p-4">
                    <div className="text-xs text-slate-500">Open Tickets</div>
                    <div className="mt-1 text-2xl font-bold text-amber-700">{openTicketsCount}</div>
                    <div className="mt-1 text-[11px] text-slate-500">{escalatedCount} currently escalated</div>
                  </div>
                  <div className="rounded-lg border border-slate-200 bg-white p-4">
                    <div className="text-xs text-slate-500">Resolved / Closed</div>
                    <div className="mt-1 text-2xl font-bold text-emerald-700">{resolvedCount}</div>
                    <div className="mt-1 text-[11px] text-slate-500">Resolution confirmation enforced</div>
                  </div>
                  <div className="rounded-lg border border-slate-200 bg-white p-4">
                    <div className="text-xs text-slate-500">ERP &amp; CRM Integrations</div>
                    <div className="mt-1 text-sm font-bold text-slate-900">Read-Only (Pending Discovery)</div>
                    <div className="mt-1 text-[11px] text-slate-500">Zero live writes permitted</div>
                  </div>
                </section>

                {/* TAB 1: HELPDESK & AI TRIAGE */}
                {activeTab === "HELPDESK" && (
                  <div className="space-y-6">
                    <section className="grid gap-6 lg:grid-cols-2">
                      <form onSubmit={handleCreateTicket} className="rounded-lg border border-slate-200 bg-white p-5 space-y-4">
                        <h2 className="text-base font-semibold text-slate-900">Raise IT Support Ticket</h2>

                        <div>
                          <label className="block text-xs font-medium text-slate-700">Select Branch</label>
                          <select
                            value={newBranchId}
                            onChange={(e) => setNewBranchId(e.target.value)}
                            className="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm"
                          >
                            {visibleBranches.map((b) => (
                              <option key={b.id} value={b.id}>
                                {b.code} — {b.name}
                              </option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700">Issue Title</label>
                          <input
                            type="text"
                            value={title}
                            onChange={(e) => setTitle(e.target.value)}
                            placeholder="Try: 'CCTV camera offline' or 'Wi-Fi down in staff room'"
                            className="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700">Issue Description</label>
                          <textarea
                            rows={3}
                            value={description}
                            onChange={(e) => setDescription(e.target.value)}
                            placeholder="Describe device, room/floor, and operational impact..."
                            className="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700">Attach Screenshot / Photo (Permitted File Types Only)</label>
                          <input
                            type="file"
                            accept=".png,.jpg,.jpeg,.pdf"
                            onChange={(e) => setAttachmentName(e.target.files?.[0]?.name || "")}
                            className="mt-1 block w-full text-xs text-slate-600"
                          />
                        </div>

                        <button
                          type="submit"
                          className="rounded-md bg-indigo-700 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-800"
                        >
                          Submit Ticket
                        </button>
                      </form>

                      <div className="rounded-lg border border-slate-200 bg-white p-5 space-y-3">
                        <div className="flex items-center justify-between">
                          <h2 className="text-base font-semibold text-slate-900">AI Ticket Classification Preview</h2>
                          <span className="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-700">
                            Suggestion Only
                          </span>
                        </div>
                        <p className="text-xs text-slate-600">
                          Validates structured JSON schema and enforces human review on low confidence (&lt;75%), duplicates, CCTV, or account access requests.
                        </p>
                        <dl className="grid grid-cols-2 gap-3 rounded-md bg-slate-50 p-3 text-xs">
                          <div>
                            <dt className="text-slate-500">Suggested Category</dt>
                            <dd className="font-semibold text-slate-900">{aiPreview.category}</dd>
                          </div>
                          <div>
                            <dt className="text-slate-500">Suggested Priority</dt>
                            <dd className="font-semibold text-slate-900">{aiPreview.priority}</dd>
                          </div>
                          <div>
                            <dt className="text-slate-500">Suggested Team</dt>
                            <dd className="font-semibold text-slate-900">{aiPreview.suggestedTeam}</dd>
                          </div>
                          <div>
                            <dt className="text-slate-500">Confidence Score</dt>
                            <dd className="font-semibold text-slate-900">{Math.round(aiPreview.confidence * 100)}%</dd>
                          </div>
                        </dl>
                        {aiPreview.requiresHumanReview ? (
                          <div className="rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-900">
                            <strong>Human Review Required:</strong> Flagged for IT admin/technician verification before action.
                          </div>
                        ) : (
                          <div className="rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs text-emerald-900">
                            <strong>Standard Suggestion:</strong> Meets confidence threshold; awaiting technician acknowledgement.
                          </div>
                        )}
                      </div>
                    </section>

                    {/* Ticket Queue */}
                    <section className="rounded-lg border border-slate-200 bg-white p-5 space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <h2 className="text-base font-semibold text-slate-900">
                          Ticket Queue &amp; Full Audit History ({visibleTickets.length})
                        </h2>
                        <div className="flex flex-wrap gap-2 text-xs">
                          {roleScope === "CENTRAL_IT" && (
                            <select
                              value={branchFilter}
                              onChange={(e) => setBranchFilter(e.target.value)}
                              className="rounded border border-slate-300 px-2 py-1"
                            >
                              <option value="ALL">All 8 Branches</option>
                              {branches.map((b) => (
                                <option key={b.id} value={b.id}>{b.code} — {b.name}</option>
                              ))}
                            </select>
                          )}
                          <select
                            value={statusFilter}
                            onChange={(e) => setStatusFilter(e.target.value)}
                            className="rounded border border-slate-300 px-2 py-1"
                          >
                            <option value="ALL">All Statuses</option>
                            {ALL_STATUSES.map((s) => (
                              <option key={s} value={s}>{s}</option>
                            ))}
                          </select>
                          <select
                            value={categoryFilter}
                            onChange={(e) => setCategoryFilter(e.target.value)}
                            className="rounded border border-slate-300 px-2 py-1"
                          >
                            <option value="ALL">All Categories</option>
                            <option value="HARDWARE">HARDWARE</option>
                            <option value="NETWORK">NETWORK</option>
                            <option value="SOFTWARE">SOFTWARE</option>
                            <option value="CCTV">CCTV</option>
                            <option value="CLASSROOM_TECHNOLOGY">CLASSROOM_TECHNOLOGY</option>
                            <option value="PRINTER">PRINTER</option>
                            <option value="ACCOUNT_ACCESS">ACCOUNT_ACCESS</option>
                          </select>
                        </div>
                      </div>

                      <div className="space-y-4">
                        {visibleTickets.map((ticket) => {
                          const bObj = branches.find((b) => b.id === ticket.branchId);
                          return (
                            <div key={ticket.id} className="rounded-lg border border-slate-200 p-4 space-y-3">
                              <div className="flex flex-wrap items-start justify-between gap-2">
                                <div>
                                  <div className="text-xs text-slate-500">
                                    <span className="font-mono font-semibold text-indigo-700">{ticket.ticketNumber}</span> •{" "}
                                    <span className="font-medium text-slate-700">{bObj ? `${bObj.code} (${bObj.name})` : ticket.branchId}</span> •{" "}
                                    Assigned: <span className="font-medium">{ticket.assignedTech}</span>
                                  </div>
                                  <h3 className="mt-1 font-semibold text-slate-900">{ticket.title}</h3>
                                </div>
                                <div className="flex flex-wrap gap-1.5 text-[11px] font-semibold">
                                  <span className="rounded bg-slate-100 px-2 py-1">{ticket.category}</span>
                                  <span className="rounded bg-amber-100 px-2 py-1 text-amber-900">{ticket.priority}</span>
                                  <span className="rounded bg-indigo-100 px-2 py-1 text-indigo-900">{ticket.status}</span>
                                </div>
                              </div>

                              <p className="text-sm text-slate-600">{ticket.description}</p>
                              {ticket.attachmentName && (
                                <div className="text-xs text-slate-500">Attachment: <span className="font-mono">{ticket.attachmentName}</span></div>
                              )}

                              {/* Workflow Actions */}
                              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-3 text-xs">
                                <label className="flex items-center gap-2 text-slate-700">
                                  <input
                                    type="checkbox"
                                    checked={Boolean(confirmMap[ticket.id])}
                                    onChange={(e) => setConfirmMap((p) => ({ ...p, [ticket.id]: e.target.checked }))}
                                  />
                                  User confirms issue is resolved (required to Close)
                                </label>

                                <div className="flex flex-wrap gap-1.5">
                                  {["ACKNOWLEDGED", "IN_PROGRESS", "WAITING_FOR_USER", "ESCALATED", "RESOLVED", "CLOSED"].map((st) => (
                                    <button
                                      key={st}
                                      onClick={() => handleStatusChange(ticket.id, st)}
                                      className={`rounded px-2 py-1 font-medium border ${
                                        st === "CLOSED"
                                          ? "bg-slate-900 text-white border-slate-900"
                                          : st === "ESCALATED"
                                          ? "bg-amber-50 text-amber-900 border-amber-300"
                                          : "bg-white text-slate-700 border-slate-300 hover:bg-slate-50"
                                      }`}
                                    >
                                      {st.replace(/_/g, " ")}
                                    </button>
                                  ))}
                                </div>
                              </div>

                              {/* Add Comment */}
                              <div className="flex gap-2">
                                <input
                                  type="text"
                                  value={commentDrafts[ticket.id] || ""}
                                  onChange={(e) => setCommentDrafts((p) => ({ ...p, [ticket.id]: e.target.value }))}
                                  placeholder="Add comment or diagnostic update..."
                                  className="flex-1 rounded border border-slate-300 px-2.5 py-1.5 text-xs"
                                />
                                <button
                                  onClick={() => handleAddComment(ticket.id)}
                                  className="rounded border border-slate-300 bg-slate-50 px-3 py-1.5 text-xs font-medium hover:bg-slate-100"
                                >
                                  Post Comment
                                </button>
                              </div>

                              {/* Event History */}
                              <div className="rounded bg-slate-50 p-2.5 text-xs text-slate-600 space-y-1">
                                <div className="font-semibold text-slate-700">Status &amp; Comment History</div>
                                {ticket.events.map((ev, i) => (
                                  <div key={i}>
                                    <span className="font-mono text-[11px] text-slate-400">{ev.timestamp}</span> —{" "}
                                    <span className="font-semibold">{ev.type}</span> ({ev.actor}): {ev.note}
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  </div>
                )}

                {/* TAB 2: 8 BRANCHES & CONFIGURABLE SLA */}
                {activeTab === "BRANCHES" && (
                  <div className="space-y-6">
                    <section className="rounded-lg border border-slate-200 bg-white p-5 space-y-4">
                      <h2 className="text-base font-semibold text-slate-900">
                        Configured Branches ({visibleBranches.length} visible of 8)
                      </h2>
                      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                        {visibleBranches.map((b) => (
                          <div key={b.id} className="rounded-lg border border-slate-200 bg-slate-50 p-3.5 space-y-1">
                            <div className="flex items-center justify-between text-xs font-semibold text-indigo-700">
                              <span>{b.code}</span>
                              <span className="rounded bg-white px-2 py-0.5 text-[10px] text-slate-600 border border-slate-200">{b.statusNote}</span>
                            </div>
                            <div className="font-semibold text-slate-900 text-sm">{b.name}</div>
                            <div className="text-xs text-slate-500">{b.location}</div>
                            <div className="text-xs text-slate-600 pt-1">Assigned IT: {b.tech}</div>
                          </div>
                        ))}
                      </div>
                    </section>

                    <section className="rounded-lg border border-slate-200 bg-white p-5 space-y-4">
                      <h2 className="text-base font-semibold text-slate-900">
                        Configurable SLA &amp; Escalation Targets (Admin Controlled)
                      </h2>
                      <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                        {Object.entries(slaConfig).map(([prio, vals]) => (
                          <div key={prio} className="rounded-lg border border-slate-200 p-3 space-y-2 text-xs">
                            <div className="font-bold text-slate-900">{prio} Priority</div>
                            <label className="block">
                              <span className="text-slate-500">Escalation Trigger (hrs)</span>
                              <input
                                type="number"
                                min="1"
                                value={vals.escalateHrs}
                                disabled={roleScope !== "CENTRAL_IT"}
                                onChange={(e) =>
                                  setSlaConfig((prev) => ({
                                    ...prev,
                                    [prio]: { ...prev[prio], escalateHrs: Number(e.target.value) },
                                  }))
                                }
                                className="mt-1 w-full rounded border border-slate-300 px-2 py-1"
                              />
                            </label>
                            <label className="block">
                              <span className="text-slate-500">Target Resolution (hrs)</span>
                              <input
                                type="number"
                                min="1"
                                value={vals.resolveHrs}
                                disabled={roleScope !== "CENTRAL_IT"}
                                onChange={(e) =>
                                  setSlaConfig((prev) => ({
                                    ...prev,
                                    [prio]: { ...prev[prio], resolveHrs: Number(e.target.value) },
                                  }))
                                }
                                className="mt-1 w-full rounded border border-slate-300 px-2 py-1"
                              />
                            </label>
                          </div>
                        ))}
                      </div>
                    </section>
                  </div>
                )}

                {/* TAB 3: REPORTS, INTEGRATIONS & AUDIT */}
                {activeTab === "REPORTS" && (
                  <div className="space-y-6">
                    <section className="rounded-lg border border-slate-200 bg-white p-5 space-y-4">
                      <div className="flex items-center justify-between">
                        <h2 className="text-base font-semibold text-slate-900">Management Report &amp; CSV Export</h2>
                        <button
                          onClick={exportCsvReport}
                          className="rounded-md bg-slate-900 px-3 py-1.5 text-xs font-medium text-white hover:bg-slate-800"
                        >
                          Export Scoped CSV Report
                        </button>
                      </div>

                      <div className="grid gap-4 md:grid-cols-2">
                        <div className="rounded-lg border border-slate-200 p-4 space-y-2 text-xs">
                          <div className="font-semibold text-slate-900">Custom School ERP Adapter Status</div>
                          <div className="inline-block rounded bg-amber-50 px-2 py-0.5 text-amber-900 font-medium">
                            READ_ONLY_PENDING_DISCOVERY
                          </div>
                          <p className="text-slate-600">
                            Awaiting official ERP API documentation, sandbox credentials, and security approval. No undocumented endpoints or scraping permitted.
                          </p>
                        </div>

                        <div className="rounded-lg border border-slate-200 p-4 space-y-2 text-xs">
                          <div className="font-semibold text-slate-900">CRM Platform Adapter Status</div>
                          <div className="inline-block rounded bg-amber-50 px-2 py-0.5 text-amber-900 font-medium">
                            VENDOR_UNCONFIRMED • READ-ONLY INTERFACE
                          </div>
                          <p className="text-slate-600">
                            Vendor-neutral adapter ready; live CRM writes/updates remain locked until CRM vendor confirmation and workflow sign-off.
                          </p>
                        </div>
                      </div>
                    </section>

                    <section className="rounded-lg border border-slate-200 bg-white p-5 space-y-3">
                      <h2 className="text-base font-semibold text-slate-900">Security &amp; Operations Audit Log</h2>
                      <div className="space-y-1.5 text-xs font-mono text-slate-600 max-h-64 overflow-y-auto">
                        {auditLogs.map((log, idx) => (
                          <div key={idx} className="border-b border-slate-100 pb-1">
                            [{log.timestamp}] <strong>{log.action}</strong> ({log.actor} / {log.branch}): {log.detail}
                          </div>
                        ))}
                      </div>
                    </section>
                  </div>
                )}
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
